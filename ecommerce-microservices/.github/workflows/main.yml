name: E-Commerce Microservices Pipeline
on:
  push:
    branches:
      - main

env:
  REGISTRY: your-docker-registry
  EKS_CLUSTER_NAME: ecommerce-production-cluster
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build individual layers
      - name: Build and Push Service Registry
        uses: docker/build-push-action@v4
        with:
          context: ./service-registry
          push: true
          tags: ${{ env.REGISTRY }}/ecommerce-service-registry:latest

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v4
        with:
          context: ./api-gateway
          push: true
          tags: ${{ env.REGISTRY }}/ecommerce-api-gateway:latest

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v4
        with:
          context: ./auth-service
          push: true
          tags: ${{ env.REGISTRY }}/ecommerce-auth-service:latest

      - name: Build and Push Product Service
        uses: docker/build-push-action@v4
        with:
          context: ./product-service
          push: true
          tags: ${{ env.REGISTRY }}/ecommerce-product-service:latest

      - name: Build and Push Order Service
        uses: docker/build-push-action@v4
        with:
          context: ./order-service
          push: true
          tags: ${{ env.REGISTRY }}/ecommerce-order-service:latest

      - name: Build and Push UI Service
        uses: docker/build-push-action@v4
        with:
          context: ./ui-service
          push: true
          tags: ${{ env.REGISTRY }}/ecommerce-ui-service:latest

  deploy-to-eks:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Infrastructure
        run: kubectl apply -f k8s/infrastructure/

      - name: Deploy Microservices
        run: kubectl apply -f k8s/services/
